                return { stock, minVal, maxVal, svgPath };
            }
        };

        // --- 3. Toolbox Component ---
        const ToolboxView = {
            template: `
                <div style="padding: 16px;">
                    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 16px;">Financial Toolbox</h2>
                    
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        <!-- 3.2 DCA Profit-Taking -->
                        <div class="card">
                            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">DCA Profit-Taking Calculator</h3>
                            <div class="input-group">
                                <label>Average Cost (\\$)</label>
                                <input type="number" v-model.number="dca.cost">
                            </div>
                            <div class="input-group">
                                <label>Holdings Share</label>
                                <input type="number" v-model.number="dca.shares">
                            </div>
                            <div class="input-group">
                                <label>Take-Profit Price (\\$)</label>
                                <input type="number" v-model.number="dca.target">
                            </div>
                            <div style="padding: 12px; background: var(--bg-color); border-radius: 8px; font-weight: 600; text-align: center;">
                                Estimated Profit: \\$ {{ dcaProfit.toFixed(2) }}
                            </div>
                        </div>

                        <!-- 3.3 Wealth Calendar -->
                        <div class="card">
                            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Wealth Calendar Note</h3>
                            <div class="input-group">
                                <label>Event Note</label>
                                <input type="text" v-model="cal.note" placeholder="e.g. Bond Maturity">
                            </div>
                            <div class="input-group">
                                <label>Target Date</label>
                                <input type="date" v-model="cal.date">
                            </div>
                            <button class="btn" @click="saveCal">Add to Calendar</button>
                            <div v-if="calList.length" style="margin-top: 12px; display:flex; flex-direction:column; gap:6px;">
                                <div v-for="(item, i) in calList" :key="i" style="font-size:12px; background:var(--bg-color); padding:8px; border-radius:6px; display:flex; justify-content:space-between;">
                                    <span>{{ item.note }}</span>
                                    <span style="color:var(--primary-color);">{{ item.date }}</span>
                                </div>
                            </div>
                        </div>

                        <!-- 3.4 Loan Calculator -->
                        <div class="card">
                            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Loan Calculator</h3>
                            <div class="input-group">
                                <label>Loan Amount (\\$)</label>
                                <input type="number" v-model.number="loan.amount">
                            </div>
                            <div class="input-group">
                                <label>Annual Interest Rate (%)</label>
                                <input type="number" v-model.number="loan.rate">
                            </div>
                            <div class="input-group">
                                <label>Term (Months)</label>
                                <input type="number" v-model.number="loan.months">
                            </div>
                            <div style="padding: 12px; background: var(--bg-color); border-radius: 8px; font-weight: 600; text-align: center;">
                                Monthly Payment: \\$ {{ monthlyPayment.toFixed(2) }}
                            </div>
                        </div>

                        <!-- 3.5 Profit Calculator -->
                        <div class="card">
                            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Profit Calculator</h3>
                            <div class="input-group">
                                <label>Unit Cost (\\$)</label>
                                <input type="number" v-model.number="prof.cost">
                            </div>
                            <div class="input-group">
                                <label>Unit Price (\\$)</label>
                                <input type="number" v-model.number="prof.price">
                            </div>
                            <div class="input-group">
                                <label>Quantity Sold</label>
                                <input type="number" v-model.number="prof.qty">
                            </div>
                            <div style="padding: 12px; background: var(--bg-color); border-radius: 8px; font-weight: 600; text-align: center;">
                                Total Net Profit: \\$ {{ totalProfit.toFixed(2) }}
                            </div>
                        </div>

                        <!-- 3.6 Reverse Yield -->
                        <div class="card">
                            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Reverse Yield Calculator</h3>
                            <div class="input-group">
                                <label>Target Return (\\$)</label>
                                <input type="number" v-model.number="rev.target">
                            </div>
                            <div class="input-group">
                                <label>Principal (\\$)</label>
                                <input type="number" v-model.number="rev.principal">
                            </div>
                            <div class="input-group">
                                <label>Duration (Years)</label>
                                <input type="number" v-model.number="rev.years">
                            </div>
                            <div style="padding: 12px; background: var(--bg-color); border-radius: 8px; font-weight: 600; text-align: center;">
                                Required Annual Yield: {{ requiredYield.toFixed(2) }}%
                            </div>
                        </div>

                        <!-- 3.7 Password Strength -->
                        <div class="card">
                            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Password Strength & MD5</h3>
                            <div class="input-group">
                                <label>Password Input</label>
                                <input type="password" v-model="pwd.val" placeholder="Enter secure password">
                            </div>
                            <div style="font-size: 13px; margin-bottom: 6px;">Strength: <span :style="{color: pwdColor, fontWeight:600}">{{ pwdStrength }}</span></div>
                            <div style="font-size: 11px; color: var(--text-secondary); word-break: break-all;">MD5: {{ pwdMd5 }}</div>
                        </div>

                        <!-- 3.8 Credit Memo -->
                        <div class="card">
                            <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Credit Memo</h3>
                            <div class="input-group">
                                <label>Debtor Name</label>
                                <input type="text" v-model="credit.name">
                            </div>
                            <div class="input-group">
                                <label>Amount (\\$)</label>
                                <input type="number" v-model.number="credit.amount">
                            </div>
                            <button class="btn" @click="saveCredit">Save Memo</button>
                            <div v-if="creditList.length" style="margin-top: 12px; display:flex; flex-direction:column; gap:6px;">
                                <div v-for="(item, i) in creditList" :key="i" style="font-size:12px; background:var(--bg-color); padding:8px; border-radius:6px; display:flex; justify-content:space-between;">
                                    <span>{{ item.name }}</span>
                                    <span style="font-weight:600;">\\$ {{ item.amount }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                // DCA
                const dca = reactive({ cost: 100, shares: 50, target: 120 });
                const dcaProfit = computed(() => (dca.target - dca.cost) * dca.shares);

                // Calendar
                const cal = reactive({ note: '', date: '' });
                const calList = ref([]);
                function saveCal() {
                    if(!cal.note || !cal.date) return;
                    calList.value.push({ ...cal });
                    cal.note = ''; cal.date = '';
                    showToast('Added to Calendar');
                }

                // Loan
                const loan = reactive({ amount: 100000, rate: 5, months: 12 });
                const monthlyPayment = computed(() => {
                    const r = loan.rate / 100 / 12;
                    if(r === 0) return loan.amount / loan.months;
                    return (loan.amount * r * Math.pow(1 + r, loan.months)) / (Math.pow(1 + r, loan.months) - 1);
                });

                // Profit
                const prof = reactive({ cost: 50, price: 80, qty: 100 });
                const totalProfit = computed(() => (prof.price - prof.cost) * prof.qty);

                // Reverse Yield
                const rev = reactive({ target: 2000, principal: 10000, years: 2 });
                const requiredYield = computed(() => {
                    if(!rev.principal || !rev.years) return 0;
                    return ((rev.target / rev.years) / rev.principal) * 100;
                });

                // Password
                const pwd = reactive({ val: '' });
                const pwdMd5 = computed(() => pwd.val ? md5(pwd.val) : 'N/A');
                const pwdStrength = computed(() => {
                    const len = pwd.val.length;
                    if(len === 0) return 'Empty';
                    if(len < 6) return 'Weak';
                    if(len < 10) return 'Moderate';
                    return 'Strong';
                });
                const pwdColor = computed(() => {
                    if(pwdStrength.value === 'Weak') return 'var(--danger-color)';
                    if(pwdStrength.value === 'Moderate') return '#f59e0b';
                    return 'var(--success-color)';
                });

                // Credit
                const credit = reactive({ name: '', amount: 0 });
                const creditList = ref([]);
                function saveCredit() {
                    if(!credit.name) return;
                    creditList.value.push({ ...credit });
                    credit.name = ''; credit.amount = 0;
                    showToast('Credit memo saved');
                }

                return { dca, dcaProfit, cal, calList, saveCal, loan, monthlyPayment, prof, totalProfit, rev, requiredYield, pwd, pwdMd5, pwdStrength, pwdColor, credit, creditList, saveCredit };
            }
        };

        // --- 4. Settings Component & Sub-pages ---
        const SettingsHomeView = {
            template: `

                    <div class="card" style="display: flex; flex-direction: column; gap: 4px; padding: 8px 16px;">
                        <div @click="$router.push('/settings/version')" style="padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between;">

                        </div>
                        <div @click="$router.push('/settings/privacy')" style="padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between;">
                            <span>Privacy Policy</span><span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="$router.push('/settings/terms')" style="padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between;">
                            <span>Terms of Service</span><span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="$router.push('/settings/team')" style="padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between;">
                            <span>About Team</span><span style="color:var(--text-secondary);">›</span>
                        </div>
                        <a href="mailto:adsgaa.ave.abefw@gmail.com" style="padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between; text-decoration:none; color:inherit;">
                            <span>Contact Us</span><span style="color:var(--text-secondary);">›</span>
                        </a>
                        <div @click="$router.push('/settings/checkin')" style="padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between;">
                            <span>Monthly Check-in</span><span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="$router.push('/settings/feedback')" style="padding: 12px 0; border-bottom: 1px solid var(--border-color); cursor: pointer; display: flex; justify-content: space-between;">
                            <span>Feedback</span><span style="color:var(--text-secondary);">›</span>
                        </div>
                        <div @click="$router.push('/settings/inbox')" style="padding: 12px 0; cursor: pointer; display: flex; justify-content: space-between;">
                            <span>Inbox</span><span style="color:var(--text-secondary);">›</span>
                        </div>
                    </div>
                </div>
            `
        };

        const VersionView = {
            template: `
                <div>
                    <div class="navbar"><button class="back-btn" @click="$router.go(-1)">Back</button><h2>Version</h2><div style="width:40px;"></div></div>
                    <div style="padding: 24px; text-align: center;">
                        <h3 style="font-size: 18px; margin-bottom: 8px;">JDKSMTK Mobile</h3>
                        <p style="color: var(--text-secondary);">Version 1.0.4 Build 202610</p>
                    </div>
                </div>
            `
        };

        const PrivacyView = {
            template: `
                <div>
                    <div class="navbar"><button class="back-btn" @click="$router.go(-1)">Back</button><h2>Privacy Policy</h2><div style="width:40px;"></div></div>
                    <div style="padding: 16px;" class="card">

        const TermsView = {

                <div>

        const TeamView = {
            template: `
                <div>
                    <div class="navbar"><button class="back-btn" @click="$router.go(-1)">Back</button><h2>About Team</h2><div style="width:40px;"></div></div>

        const CheckinView = {

        const FeedbackView = {

        const InboxView = {
            template: `
                <div>
                    <div class="navbar"><button class="back-btn" @click="$router.go(-1)">Back</button><h2>Inbox</h2><div style="width:40px;"></div></div>

                            <div style="background:var(--card-bg); padding:20px; border-radius:var(--radius); width:100%; max-width:320px;">

        // --- Router Configuration ---
        const routes = [
            { path: '/', component: LoadingView },
            { path: '/home', component: HomeView },
            { path: '/list/:type', component: StockListView },
            { path: '/article', component: ArticleView },
            { path: '/detail/:code', component: DetailView },
            { path: '/toolbox', component: ToolboxView },
            { path: '/settings', component: SettingsHomeView },

            history: createWebHashHistory(),

        // --- Main App Root Component ---
        const AppRoot = {

                    <div v-if="toastMessage" class="toast">{{ toastMessage }}</div>

            `,
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => {
                    const path = route.path;
                    return path === '/home' || path === '/toolbox' || path === '/settings';
                });
                const toastMessage = globalToast;
                return { showTabBar, toastMessage };
            }
        };

        const app = createApp(AppRoot);
        app.use(router);
        app.mount('#app');
    </script>
