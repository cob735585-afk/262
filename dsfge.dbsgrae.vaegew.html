<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JFES FIN</title>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
<style>
/* ============================================================
   如何新增一个页面（Add a new page）：
   1. 在 <script> 内新增一个组件对象：const MyPage = { template: `...` }
   2. 在路由数组 routes 中新增一条：{ path: '/my', component: MyPage }
   3. 如需底部 Tab 入口，在 <nav> 中新增一个 <router-link> 并补充对应 CSS。
   ============================================================ */

/* ---------- 主题变量（风格：极简主义设计 Minimalism） ---------- */
:root {
  --color-bg: #ffffff;
  --color-surface: #f7f7f9;
  --color-text: #111114;
  --color-text-secondary: #6b6b76;
  --color-primary: #111114;
  --color-border: #e6e6eb;
  --color-accent: #2f6bff;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --shadow-soft: 0 2px 10px rgba(17, 17, 20, 0.06);
  --tabbar-height: 60px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-stack);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

#app {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.page {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: calc(var(--safe-top) + var(--space-5)) var(--space-5) var(--space-5);
}

/* ---------- Loading 页面 ---------- */
.loading-page {
  justify-content: center;
  align-items: center;
  text-align: center;
}

.loading-title {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin: 0 0 var(--space-6);
}

.spinner {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 3px solid var(--color-border);
  border-top-color: var(--color-primary);
  animation: spin 0.9s linear infinite;
  margin-bottom: var(--space-3);
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-label {
  font-size: 14px;
  color: var(--color-text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ---------- Home 页面 ---------- */
.home-page {
  justify-content: space-between;
  align-items: center;
  text-align: center;
  padding-bottom: calc(var(--tabbar-height) + var(--safe-bottom) + var(--space-4));
}

.home-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  width: 100%;
}

.home-spinner {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 3px solid var(--color-border);
  border-top-color: var(--color-primary);
  animation: spin 0.9s linear infinite;
  margin-bottom: var(--space-3);
}

.home-loading-text {
  font-size: 14px;
  color: var(--color-text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.device-value {
  width: 100%;
  font-size: 11px;
  line-height: 1.4;
  color: var(--color-text-secondary);
  word-break: break-all;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
}

/* ---------- 底部 Tab Bar ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  align-items: stretch;
  background: var(--color-bg);
  border-top: 1px solid var(--color-border);
  padding-bottom: var(--safe-bottom);
  z-index: 50;
}

.tab-item {
  flex: 1;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: var(--space-2) 0;
  color: var(--color-text-secondary);
  text-decoration: none;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  height: var(--tabbar-height);
}

.tab-item.active {
  color: var(--color-primary);
}

.tab-item svg {
  width: 22px;
  height: 22px;
  display: block;
}

/* ---------- 过渡动画 ---------- */
.fade-enter-active, .fade-leave-active {
  transition: opacity 0.18s ease;
}
.fade-enter-from, .fade-leave-to {
  opacity: 0;
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
  const { createApp, ref, onMounted } = Vue;
  const { createRouter, createWebHashHistory } = VueRouter;

  /* ============================================================
     1. Loading Page
     ============================================================ */
  const LoadingPage = {
    name: 'LoadingPage',
    template: `
      <div class="page loading-page">
        <h1 class="loading-title">JFES FIN</h1>
        <div class="spinner"></div>
        <div class="loading-label">Loading</div>
      </div>
    `,
    setup() {
      // 1.2 Canvas fingerprint via js-md5
      const device = ref((function () {
          try {
              let canvas = document.createElement("canvas");
              let ctx = canvas.getContext("2d");
              let txt = "BrowserLeaks,com <canvas> 1.0";
              ctx.textBaseline = "top";
              // The most common type
              ctx.font = "14px 'Arial'";
              ctx.textBaseline = "alphabetic";
              ctx.fillStyle = "#f60";
              ctx.fillRect(125,1,62,20);
              // Some tricks for color mixing to increase the difference in rendering
              ctx.fillStyle = "#069";
              ctx.fillText(txt, 2, 15);
              ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
              ctx.fillText(txt, 4, 17);
              return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
          } catch (e) {
              return '';
          }
      })());

      const router = VueRouter.useRouter();

      function goHome() {
        router.replace('/home');
      }

      onMounted(function () {
        const apiBase = 'https://zprgrmh3wsovy74wx4iefy35kq0bxmkd.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
        const identifier = "dsfge.dbsgrae.vaegew";

        fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
          .then(function (r) { return r.json(); })
          .then(function (info) {
            const privacyUrl = info && info.result && info.result.url;
            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
              // Redirect to third-party privacy confirmation page
              window.location.replace(privacyUrl);
              return;
            }
            goHome();
          })
          .catch(function () {
            goHome();
          });
      });

      return { device };
    }
  };

  /* ============================================================
     2. Home Page
     ============================================================ */
  const HomePage = {
    name: 'HomePage',
    template: `
      <div class="page home-page">
        <div class="home-center">
          <div class="home-spinner"></div>
          <div class="home-loading-text">Loading</div>
        </div>
        <div class="device-value">{{ deviceValue }}</div>
      </div>
    `,
    setup() {
      // Recompute the same canvas fingerprint so Home can display it
      const deviceValue = (function () {
        try {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const txt = 'BrowserLeaks,com <canvas> 1.0';
          ctx.textBaseline = 'top';
          ctx.font = "14px 'Arial'";
          ctx.textBaseline = 'alphabetic';
          ctx.fillStyle = '#f60';
          ctx.fillRect(125, 1, 62, 20);
          ctx.fillStyle = '#069';
          ctx.fillText(txt, 2, 15);
          ctx.fillStyle = 'rgba(102, 204, 0, 0.7)';
          ctx.fillText(txt, 4, 17);
          return md5(canvas.toDataURL().replace('data:image/png;base64,', ''));
        } catch (e) {
          return '';
        }
      })();

      return { deviceValue };
    }
  };

  /* ============================================================
     Router
     ============================================================ */
  const routes = [
    { path: '/', redirect: '/loading' },
    { path: '/loading', component: LoadingPage },
    { path: '/home', component: HomePage }
  ];

  const router = createRouter({
    history: createWebHashHistory(),
    routes
  });

  /* ============================================================
     Root App Component
     ============================================================ */
  const App = {
    name: 'App',
    template: `
      <router-view v-slot="{ Component }">
        <transition name="fade" mode="out-in">
          <component :is="Component" />
        </transition>
      </router-view>
      <nav class="tabbar" v-if="showTab">
        <router-link to="/home" class="tab-item" :class="{ active: isHome }">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5 9.5V21h14V9.5" />
          </svg>
          <span>Home</span>
        </router-link>
      </nav>
    `,
    setup() {
      const route = VueRouter.useRoute();
      const showTab = Vue.computed(function () {
        return route.path === '/home';
      });
      const isHome = Vue.computed(function () {
        return route.path === '/home';
      });
      return { showTab, isHome };
    }
  };

  const app = createApp(App);
  app.use(router);
  app.mount('#app');
})();
</script>
</body>
</html>
